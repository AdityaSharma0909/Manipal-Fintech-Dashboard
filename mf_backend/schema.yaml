    get:
      operationId: lead_agent_new_lead_retrieve
      description: Returns a list of V2 agent-source leads for the authenticated user
        with search and location filters.
      summary: List my leads with search and filter options
      parameters:
      - in: query
        name: contact_number
        schema:
          type: string
        description: 'Filter by Phone Number. Example: `9876543210`'
      - in: query
        name: created_on
        schema:
          type: string
          format: date
        description: 'Filter by Date (YYYY-MM-DD). Example: `2024-03-25`'
      - in: query
        name: customer_name
        schema:
          type: string
        description: 'Filter by Customer Name. Example: `John Doe`'
      - in: query
        name: district
        schema:
          type: string
        description: 'Filter by District (comma separated for multiple). Example:
          `Bangalore,Mysore`'
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: 'Filter by End Date (YYYY-MM-DD). Example: `2024-03-28`'
      - in: query
        name: lead_code
        schema:
          type: string
        description: 'Filter by Lead ID. Example: `MPAGL0183`'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Page size
      - in: query
        name: pincode
        schema:
          type: string
        description: 'Filter by Pincode. Example: `560001`'
      - in: query
        name: product_category
        schema:
          type: string
        description: 'Filter by Product Category. Example: `LOAN`'
      - in: query
        name: product_subcategory
        schema:
          type: string
        description: 'Filter by Product Subcategory (comma separated for multiple).
          Example: `GOLD_LOAN,PERSONAL_LOAN`'
      - in: query
        name: punched_by
        schema:
          type: string
        description: 'Filter by Punched by (employee_id). Example: `EMP1001`'
      - in: query
        name: search
        schema:
          type: string
        description: 'Search across Name, Phone, and Lead ID. Example: `John` or `9876543210`'
      - in: query
        name: start_date
        schema:
