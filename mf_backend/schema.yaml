        Returns:
          - total_leads
          - by_status:        { status → count }
          - by_loan_type:     { loan_type → count }   (from NewLead)
          - by_source:        { source → count }
          - conversion_rate:  % of leads that moved to DISBURSED status (NewLead)
          - monthly_trend:    [ { month, count } ]  last 6 months
      tags:
      - dashboard
      responses:
        '200':
