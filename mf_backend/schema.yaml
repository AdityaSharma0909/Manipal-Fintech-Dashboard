      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
            examples:
              ApplicationCreatePayload:
                value:
                  lead: f6048bb2-4338-4056-9d35-4f23e7c13942
                  lending_partner: AXIS_BANK
                  loan_type: BALANCE_TRANSFER
                summary: Application Create Payload
