  /api/v2/onboarding/applications/loan-punch/:
    get:
      operationId: api_v2_onboarding_applications_loan_punch_retrieve
      description: Retrieve existing loan punch records for a given application ID.
      summary: Get loan punch entries for an application
      parameters:
      - in: query
        name: Application ID
        schema:
          type: string
        description: 'Application ID. Example: MPAGL0183'
        required: true
      tags:
      - Onboarding V2
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPunchGetResponse'
          description: ''
        '404':
          description: Application not found.
    post:
      operationId: loan_punch_create
      description: 'Accepts one or more loan punch records for a single application.
        All loans in the request must belong to the same bank. Set is_submit to False
        for Save and Exit functionality. When is_submit is True (default), the following
        fields are mandatory for each loan: bank_name, approved_tenure, disbursed_amount,
        rate_of_interest, loan_account_number, sanctioned_amount, loan_opening_date.
        For GOLD_LOAN applications, gross_weight and net_weight are also mandatory.
        Final Bajaj submissions (including BT) also require loan_account_document
        and product_approval_screenshot URLs. These fields are optional for other
        banks.'
      summary: Create loan punch entries for an application
      tags:
      - Onboarding V2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanPunch'
            examples:
              SaveAndExitPayload:
                value:
                  application_id: MPAGL0183
                  is_submit: false
                  agent_id: A123
                  agent_name: Agent Smith
                  loans:
                  - approval_status: APPROVED
                    bank_name: HDFC BANK
                    crm_id: CRM987654
                    is_agriculture: false
                    loan_account_number: '5010012345'
                    loan_account_document: https://storage.example.com/lan-document.jpg
                    product_approval_screenshot: https://storage.example.com/product-approval.jpg
                    loan_opening_date: '2024-03-25'
                    sanctioned_amount: 50000.0
                    approved_tenure: 12
                    disbursed_amount: 45000.0
                    rate_of_interest: 10.5
                    gross_weight: 15.5
                    net_weight: 14.2
                    is_customer_kit_gifted: true
                    remarks: Partially filled info
                summary: Save and Exit Payload
              RejectedLoanPayload:
                value:
                  application_id: MPAGL0183
                  agent_id: A123
                  agent_name: Agent Smith
                  loans:
                  - approval_status: REJECTED
                    rejection_reason: Low Credit Score
                    remarks: Customer does not meet criteria
                    bank_name: Axis Bank
                summary: Rejected Loan Payload
              ApprovedLoanPayload:
                value:
                  application_id: MPAGL0183
                  loans:
                  - approval_status: APPROVED
                    bank_name: HDFC BANK
                    crm_id: CRM987654
                    is_agriculture: false
                    loan_account_number: '5010012345'
                    loan_opening_date: '2024-03-25'
                    sanctioned_amount: 50000.0
                    approved_tenure: 12
                    disbursed_amount: 45000.0
                    rate_of_interest: 10.5
                    gross_weight: 15.5
                    net_weight: 14.2
                    is_customer_kit_gifted: true
                    is_bank_changed: true
                    new_bank_name: New Bank
                    new_bank_state: Karnataka
                    new_bank_district: Bangalore
                    new_bank_branch: HSR Layout
                    remarks: Loan approved after successful verification
                    kit_images:
                    - https://storage.example.com/kit1.jpg
                    - https://storage.example.com/kit2.jpg
                    loan_doc_images:
                    - https://storage.example.com/doc1.pdf
                summary: Approved Loan Payload
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoanPunch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoanPunch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPunchSuccessResponse'
          description: Loan punching completed successfully.
        '400':
          description: Validation error in request payload.
        '500':
          description: Unexpected server error while punching loan.
