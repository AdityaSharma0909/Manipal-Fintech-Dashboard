      security: []
      responses:
        '200':
          description: No response body
  /api/v2/onboarding/applications/{application_id}/correction/:
    get:
      operationId: correction_list
      description: Fetches all correction records raised for the given application.
        Returns corrections ordered by most recent first. Optionally filter by status
        using the `status` query parameter.
      summary: List all corrections for an application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        description: Unique application identifier (e.g. MPAGL0183).
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING
          - RESOLVED
        description: 'Filter corrections by status. Allowed values: `PENDING`, `RESOLVED`.'
      tags:
      - Onboarding V2 - Corrections
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionListResponse'
              examples:
                AllCorrectionsResponse:
                  value:
                    status: success
                    data:
                      application_id: MPAGL0183
                      count: 2
                      corrections:
                      - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        application_id: MPAGL0183
                        stage: PAN
                        field_name: pan_number
                        image_id: null
                        payload: {}
                        status: PENDING
                        created_at: '2024-03-25T10:00:00Z'
                        modified_at: '2024-03-25T10:00:00Z'
                      - id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                        application_id: MPAGL0183
                        stage: ADDRESS
                        field_name: pincode
                        image_id: null
                        payload:
                          expected: '560001'
                        status: RESOLVED
                        created_at: '2024-03-24T09:00:00Z'
                        modified_at: '2024-03-24T09:30:00Z'
                  summary: All Corrections Response
          description: Corrections fetched successfully.
        '400':
          description: Application not found.
        '500':
          description: Internal server error.
    post:
      operationId: correction_raise
      description: Raises one or multiple correction entries for a specific application.
        Accepts either a single correction object or a list of correction objects.
        On success, the application status is automatically updated to `CORRECTION_RAISED_BY_UNDERWRITING`.
      summary: Raise corrections for an application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        description: Unique application identifier (e.g. MPAGL0183).
        required: true
      tags:
      - Onboarding V2 - Corrections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRaiseRequest'
            examples:
              SingleCorrection:
                value:
                  stage: PAN
                  field_name: pan_number
                  image_id: null
                  payload: {}
                summary: Single Correction
              MultipleCorrections(List):
                value:
                - stage: PAN
                  field_name: pan_number
                  image_id: null
                  payload: {}
                - stage: ADDRESS
                  field_name: pincode
                  image_id: img_abc123
                  payload:
                    expected: '560001'
                summary: Multiple Corrections (List)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CorrectionRaiseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectionRaiseRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionRaiseResponse'
              examples:
                SuccessResponse:
                  value:
                    status: success
                    data:
                      message: 2 correction(s) raised successfully
                      application_id: MPAGL0183
                      status: CORRECTION_RAISED_BY_UNDERWRITING
                  summary: Success Response
          description: Correction(s) raised successfully.
        '400':
          description: Validation error or application not found.
        '500':
          description: Internal server error.
