[pytest]
# =============================================================================
# ICICI CRM Backend — pytest configuration
# =============================================================================
DJANGO_SETTINGS_MODULE = config.settings.development

addopts =
    -v
    --strict-markers
    --tb=short
    --no-header
    -rN

testpaths = tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (no DB, no external calls)
    integration: Integration tests (hit DB or external APIs)
    api: API endpoint tests via DRF test client
    slow: Tests that take > 1s to run
