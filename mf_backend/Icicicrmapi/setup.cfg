# =============================================================================
# ICICI CRM Backend — Tool Configuration (setup.cfg)
# =============================================================================

[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    staticfiles,
    .tox,
    build,
    dist

[isort]
profile = black
line_length = 100
known_django = django
known_drf = rest_framework
known_first_party = apps, config
sections = FUTURE, STDLIB, DJANGO, DRF, THIRDPARTY, FIRSTPARTY, LOCALFOLDER
skip = migrations, .venv, venv

[mypy]
python_version = 3.12
ignore_missing_imports = True
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
plugins =
    mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings.development

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */__init__.py
    */apps.py
    */admin.py

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 80
