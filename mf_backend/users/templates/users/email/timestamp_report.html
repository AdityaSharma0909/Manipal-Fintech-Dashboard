<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Attendance Report</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 16px;
        }

        .content {
            padding: 30px;
        }

        .summary-grid {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 35px;
        }

        .summary-card {
            flex: 1;
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .summary-card .label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        .summary-card .value {
            font-size: 24px;
            color: #1e293b;
            font-weight: 800;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-align: left;
            padding: 14px 12px;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            color: #334155;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-in {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-out {
            background-color: #fee2e2;
            color: #991b1b;
        }

        @media only screen and (max-width: 600px) {
            .summary-grid {
                flex-direction: column;
            }

            .header {
                padding: 30px 15px;
            }

            .content {
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Daily Attendance Report</h1>
            <p>{{ report_date }}</p>
        </div>
        <div class="content">
            <div class="summary-grid">
                <div class="summary-card">
                    <span class="label">Total Records</span>
                    <div class="value">{{ total_count }}</div>
                </div>
                <div class="summary-card">
                    <span class="label">Check-ins</span>
                    <div class="value" style="color: #166534;">{{ check_in_count }}</div>
                </div>
                <div class="summary-card">
                    <span class="label">Check-outs</span>
                    <div class="value" style="color: #991b1b;">{{ check_out_count }}</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
