upstream manipal_backend {
    server manipal_app:8000;
}

upstream manipal_frontend {
    server ${FRONTEND_CONTAINER_NAME}:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $manipal_backend http://manipal_app:8000;
    set $manipal_frontend http://${FRONTEND_CONTAINER_NAME}:80;

    location ^~ /assets/ {
        proxy_pass $manipal_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public v2: /api/api/v2/… → Django /api/v2/… (frontend baseURL /api/ + path /api/v2/…)
    location ^~ /api/api/v2/onboarding/ {
        rewrite ^/api/api/v2/onboarding/(.*)$ /api/v2/onboarding/$1 break;
        proxy_pass $manipal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location ^~ /api/api/v2/check-update {
        rewrite ^/api/api/v2/check-update(.*)$ /api/v2/check-update$1 break;
        proxy_pass $manipal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Legacy /api/v2/… (single api) — pass through to Django as-is
    location ^~ /api/v2/ {
        proxy_pass $manipal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Non–v2 public API: /api/user/… → Django /user/…
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $manipal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Direct paths without /api/ (mobile, old clients, tools)
    location ~ ^/(admin|authenticate|user|account|application|lead|document|product|loan|disbursements|lender|branch|gold_prices|radian_products|generate_open_leads|gold_value|gold_loan_calculator_by_amount|gold_loan_calculator_by_asset|core|federal|payment|credit|reference_pd|tele|scoreme|cibil|flow|task|zoop|leegality|check-update|insurance/?$) {
        proxy_pass $manipal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /static_assets/ {
        alias /app/static_assets/;
    }

    location / {
        proxy_pass $manipal_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
