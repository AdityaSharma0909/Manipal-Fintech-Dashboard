version: "3.8"

volumes:
  app_data:
    name: radian_data
  media_data:
    name: radian_media_data
  # host_backup_data: # move this to the top level
  #     name: radian_host_backup_data  # adjust the volume name

services:
  radian_app:
    build:
      context: ../
      dockerfile: docker/dockerfile
    image: radian_app:development
    volumes:
      - media_data:/app/media
    container_name: radian_app
    command: /app/docker/start.sh
    depends_on:
      - radian_db
      - radian_redis
    env_file:
      - ../.env
    ports:
      - 8000:8000
    environment:
      DJANGO_POSTGRES_HOST: radian_db
      BROKER_URL: redis://radian_redis:6379
      CELERY_RESULT_BACKEND: redis://radian_redis:6379
      ELASTICSEARCH_HOST: uat-search.radianfinserv.com
      ELASTICSEARCH_PORT: 9292
      ELASTICSEARCH_USERNAME: radian
      ELASTICSEARCH_PASSWORD: radian1234
      APP_ENV: PROD
      PAYMENT_ENV: live
      PROD_STORAGE_BUCKET_NAME: radian
      SCORE_ME_BASE_URL: https://sm-bsa.scoreme.in
      SCORE_ME_CLIENT_ID: 1429b1447ab450a6a53671c836cd6c3c
      SCORE_ME_CLIENT_SECRET: f43259e0f0f89519fa30e59726d36bb22cb106539b3a760a517965fec337c3f0

  celery_worker:
    build:
      context: ../
      dockerfile: docker/dockerfile
    image: radian_app:development
    container_name: radian_celery_worker
    command: celery -A radian_backend worker -l info
    depends_on:
      radian_db:
        condition: service_started
      radian_redis:
        condition: service_started
      backup_permissions:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      DJANGO_POSTGRES_HOST: radian_db
      BROKER_URL: redis://radian_redis:6379
      CELERY_RESULT_BACKEND: redis://radian_redis:6379
      APP_ENV: PROD
      RUN_MIGRATIONS: "false"
    volumes:
      - media_data:/app/media
      # Exposes completed dumps at /root/mf_backend/db_backups on the host
      # when this repository is deployed at /root/mf_backend.
      - ../db_backups:/app/db_backups

  backup_permissions:
    image: radian_app:development
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /app/db_backups && chown -R app_user:app_user /app/db_backups && chmod 0750 /app/db_backups"
    restart: "no"
    volumes:
      - ../db_backups:/app/db_backups

  celery_beat:
    build:
      context: ../
      dockerfile: docker/dockerfile
    image: radian_app:development
    container_name: radian_celery_beat
    command: celery -A radian_backend beat -l info -s /tmp/celerybeat-schedule
    depends_on:
      - radian_db
      - radian_redis
    env_file:
      - ../.env
    environment:
      DJANGO_POSTGRES_HOST: radian_db
      BROKER_URL: redis://radian_redis:6379
      CELERY_RESULT_BACKEND: redis://radian_redis:6379
      APP_ENV: PROD
      RUN_MIGRATIONS: "false"
    volumes:
      - media_data:/app/media

  radian_redis:
    container_name: radian_redis
    image: redis

  radian_db:
    build:
      context: ../
      dockerfile: docker/postgres/dockerfile
      args:
        APP_ENV: PROD
    image: radian_postgres
    container_name: radian_db
    volumes:
      - app_data:/var/lib/postgresql/data
      # - host_backup_data:/host_backup  # adjust the volume reference
    environment:
      POSTGRES_PASSWORD: radian1234
      POSTGRES_USER: radian
      POSTGRES_DB: radian
      APP_ENV: PROD

    # command: >
    #     bash -c "
    #     echo '2 * * * * root /backup_script.sh' > /etc/cron.d/backup-cron &&
    #     crontab /etc/cron.d/backup-cron &&
    #     cron -f"
#        command: >
#            bash -c "
#            sleep 500 &&
#            mkdir -p /backup &&
#            PGPASSWORD=radian1234 pg_dump -h radian_db -U radian radian > /backup/radian_db.sql &&
#            cp /backup/radian_db.sql /host_backup/"
# backup:
#     image: postgres
#     container_name: radian_backup
#     volumes:
#         - ./backup:/backup
#         - host_backup_data:/host_backup  # adjust the volume reference
#     depends_on:
#         - radian_db
#     command: /app/docker/backup.sh  # this script will be executed by the cron job

networks:
  default:
    name: radian_network
