# ✅ version key is obsolete, safe to remove
volumes:
  app_data:
    name: manipal_data
  media_data:
    name: manipal_media_data
  search_data:
    name: manipal_search_data
  static_data:        # ✅ added missing volume
    name: manipal_static_data

services:
  manipal_app:
    build:
      context: ../
      dockerfile: docker/dockerfile
    image: manipal_app:development
    volumes:
      - media_data:/app/media
      - static_data:/app/static       # ✅ also mount static data to app
    command: /app/docker/start.sh
    depends_on:
      - manipal_db
      - manipal_redis
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      DJANGO_POSTGRES_HOST: manipal_db
      APP_ENV: DEV
      PAYMENT_ENV: test
      BROKER_URL: redis://manipal_redis:6379
      CELERY_RESULT_BACKEND: redis://manipal_redis:6379

  manipal_db:
    build:
      context: ../
      dockerfile: docker/postgres/dockerfile
      args:
        APP_ENV: DEV
    image: manipal_postgres
    container_name: manipal_db
    volumes:
      - app_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: manipal1234
      POSTGRES_USER: manipal
      POSTGRES_DB: manipal_db
      APP_ENV: DEV

  manipal_gateway:
      build:
          context: ../
          dockerfile: docker/nginx/dockerfile
      image: manipal_gateway:development
      container_name: manipal_gateway
      depends_on:
          - manipal_db
          - manipal_app
      volumes:
          - static_data:/app/static
          - media_data:/app/media
          - ../assets:/app/static_assets:ro
      environment:
          - FRONTEND_CONTAINER_NAME=${FRONTEND_CONTAINER_NAME}
      ports:
          - "80:80"

  manipal_redis:
      container_name: manipal_redis
      image: redis
      ports:
          - "6379:6379"

  backup_permissions:
      image: manipal_app:development
      user: root
      entrypoint: ["/bin/sh", "-c"]
      command:
          - "mkdir -p /app/db_backups && chown -R app_user:app_user /app/db_backups && chmod 0750 /app/db_backups"
      restart: "no"
      volumes:
          - ../db_backups:/app/db_backups

  celery_worker:
      build:
          context: ../
          dockerfile: docker/dockerfile
      container_name: manipal_celery_worker
      command: celery -A radian_backend worker -l info
      depends_on:
          manipal_db:
              condition: service_started
          manipal_redis:
              condition: service_started
          backup_permissions:
              condition: service_completed_successfully
      env_file:
          - ../.env
      environment:
          DJANGO_POSTGRES_HOST: manipal_db
          BROKER_URL: redis://manipal_redis:6379
          CELERY_RESULT_BACKEND: redis://manipal_redis:6379
          APP_ENV: DEV
          RUN_MIGRATIONS: "false"
      volumes:
          - media_data:/app/media
          - ../db_backups:/app/db_backups
          - ../keys/production_known_hosts:/app/keys/production_known_hosts:ro

  celery_beat:
      build:
          context: ../
          dockerfile: docker/dockerfile
      container_name: manipal_celery_beat
      command: celery -A radian_backend beat -l info -s /tmp/celerybeat-schedule
      depends_on:
          - manipal_db
          - manipal_redis
      env_file:
          - ../.env
      environment:
          DJANGO_POSTGRES_HOST: manipal_db
          BROKER_URL: redis://manipal_redis:6379
          CELERY_RESULT_BACKEND: redis://manipal_redis:6379
          APP_ENV: DEV
          RUN_MIGRATIONS: "false"
      volumes:
          - media_data:/app/media

networks:
  default:
    name: manipal_network
